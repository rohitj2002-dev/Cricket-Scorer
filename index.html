<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
/*ENGINE*/
const CFG={wd:2,nb:2,wkt:5};
const MAXO=m=>m.fmt==10?20:22;
const DEF=[0,1,2,3,4].map(i=>({ov:i*4,pl:[i*2,i*2+1]})).concat([{ov:20,pl:[10]}]);

function compute(m,i){
 const n=m.inn[i],c=m.cfg,o={runs:0,wk:0,legal:0,wd:0,nb:0,bat:{},pair:{},bowl:{},fld:{},cur:[],net:0};
 const SP=SPL(n),sf=ov=>SP.findIndex(s=>ov>=s.ov&&ov<s.ov+s.pl.length*2);let st=0,lu=-1,lo=-1;const g=(t,k,d)=>t[k]||(t[k]=d());
 n.ev.forEach(e=>{
  const ov=Math.floor(o.legal/6),u=sf(ov),Q=SP[u];
  if(!Q)return;
  if(u!=lu){st=0;lu=u}if(ov!=lo){lo=ov;o.cur=[]}
  if(e.t=='sw'){st^=1;return}
  const b=Q.pl[Q.pl.length>1?st:0],how=e.how||'b';let r=0,leg=0,bf=0,w=0,bs=0,lb,d=b,bz=0;
  if(e.t=='r'){r=e.r;leg=1;bf=1;bs=e.r;lb=e.r?String(e.r):'•'}
  else if(e.t=='nb'||e.t=='wd'){const cn=e.c===1,nbk=e.t=='nb',base=e.c===0?1:nbk?c.nb:c.wd;bz=base;r=base+e.r;leg=cn?1:0;if(nbk){bf=1;bs=e.r;o.nb+=base}else o.wd+=r;lb=(nbk?'Nb':'Wd')+(e.r?'+'+e.r:'')}
  else{w=1;leg=1;bf=1;lb='W';if(how=='ro')d=Q.pl[e.os||0]??b}
  const nb=()=>({r:0,b:0,w:0,d:[]}),B=g(o.bat,b,nb),P=g(o.pair,u,()=>({r:0,w:0,b:0})),W=g(o.bowl,e.bw,()=>({b:0,r:0,w:0,wd:0,nb:0}));
  B.r+=bs;B.b+=bf;P.r+=r;P.w+=w;P.b+=leg;W.b+=leg;W.r+=r;
  if(e.t=='wd')W.wd+=r;if(e.t=='nb')W.nb+=bz;
  if(w){const D=g(o.bat,d,nb);D.w++;D.d.push({h:how,bw:e.bw,f:e.fl});if(how!='ro')W.w++;
   const k={c:'ct',ro:'ro',st:'st'}[how];if(k&&e.fl!=null)g(o.fld,e.fl,()=>({ct:0,ro:0,st:0}))[k]++}
  o.runs+=r;o.wk+=w;o.legal+=leg;o.cur.push(lb);
  if(bs%2)st^=1;if(leg&&o.legal%6==0)st^=1;
 });
 const ov=Math.floor(o.legal/6),u=sf(ov),Q=SP[u];
 if(u!=lu)st=0;if(ov!=lo)o.cur=[];
 o.u=u;o.st=st;o.sp=Q;o.bt=Q?Q.pl[Q.pl.length>1?st:0]:null;o.ov=ov;o.ball=o.legal%6;o.net=o.runs-o.wk*c.wkt;

}
function result(m){

}

function cm(){const vl=location.origin+location.pathname+'#g='+G+'&v=1';

<button class="btn" style="width:100%" onclick="dx()">Close</button></div></div>`}

 if(G&&G!=v){S.ms=[];S.cur=null;S.view='hist';LP={}}G=v;try{localStorage.setItem('icmg',G)}catch(e){}hd();sub();render()},G)}
const M=()=>S.ms.find(x=>x.id==S.cur);
function go(v){S.view=v;if(v=='setup')S.cur=null;S.fix=false;save();render()}
function start(){if(RO())return;
 const f=S.fmt,mk=i=>{const nm=($('#n'+i).value.trim()||'Team '+'AB'[i]);const raw=$('#p'+i).value.split('\n').map(x=>x.trim()).filter(Boolean);
  return{name:nm,pl:Array.from({length:f},(_,k)=>raw[k]||'Player '+(k+1))}};
 const t=[mk(0),mk(1)],fb=+$('#fb').value;
 const m={id:Date.now(),fmt:f,teams:t.map(x=>({name:x.name,players:x.pl})),cfg:{...CFG},ci:0,done:false,date:new Date().toLocaleString(),
  inn:[{bat:fb,bowl:1-fb,ev:[],sp:[],ovb:{},done:false}]};

}
function add(e){const m=M(),n=m.inn[m.ci],o=compute(m,m.ci);if(o.done||!o.sp||n.ovb[o.ov]==null)return;n.ev.push({...e,bw:n.ovb[o.ov]});S.mode='';save();render()}
function press(r){add(S.mode?{t:S.mode,r,c:S.cnt}:{t:'r',r})}
function spTog(k){const q=S.sp,need=q.k=='pair'?2:1;q.sel=q.sel.includes(k)?q.sel.filter(x=>x!=k):q.sel.length<need?[...q.sel,k]:q.sel;render()}
function spOk(){const m=M(),n=m.inn[m.ci],o=compute(m,m.ci);n.sp.push({ov:o.ov,pl:S.sp.sel});S.sp=null;save();render()}
function pickBw(k){const m=M(),n=m.inn[m.ci],o=compute(m,m.ci);n.ovb[o.ov]=k;save();render()}
function chBw(){const m=M(),n=m.inn[m.ci];delete n.ovb[compute(m,m.ci).ov];save();render()}
function wkOk(){const w=S.wk;S.wk=null;add({t:'w',how:w.how,os:w.os||0,fl:['c','st','ro'].includes(w.how)?(w.fl??0):null})}
function undo(){const m=M(),n=m.inn[m.ci];if(!n.ev.length)return;n.ev.pop();n.done=false;save();render()}
function endInn(){dlg('End this innings now?',()=>{M().inn[M().ci].done=true;save();render()})}
function advance(){const m=M();if(m.ci==0){const f=m.inn[0];m.inn.push({bat:f.bowl,bowl:f.bat,ev:[],sp:[],ovb:{},done:false});m.ci=1}else m.done=true;S.tab='score';save();render()}
function reopen(){const m=M();m.done=false;m.inn[m.ci].done=false;S.view='live';save();render()}
function setBw(v){const m=M();m.inn[m.ci].bw=+v;save();render()}
function parse(s){s=s.trim().toLowerCase();if(s=='w')return{t:'w'};let k=s.match(/^(wd|nb)(\d)?$/);if(k)return{t:k[1],r:+(k[2]||0)};if(/^[0-6]$/.test(s))return{t:'r',r:+s};return null}
function edit(i){const n=M().inn[M().ci],e=n.ev[i];dlg('Replace with: 0-6 runs, w, wd, wd2 (wide+2), nb, nb4',p=>{const x=parse(p);if(!x)return dlg('Invalid entry');n.ev[i]={...e,...x,r:x.r||0};if(x.t=='wd'||x.t=='nb')n.ev[i].c=e.c??1;save();render()},e.t=='w'?'w':e.t=='r'?e.r:e.t+(e.r||''))}
function del(i){M().inn[M().ci].ev.splice(i,1);M().inn[M().ci].done=false;save();render()}
let DL=null;

const ovs=b=>Math.floor(b/6)+'.'+b%6;
/*PDF*/
const pd=(s,n)=>String(s).slice(0,n).padEnd(n),rp=(s,n)=>String(s).padStart(n);
function pdfLines(m){
 const L=[],W=m.cfg.wkt,nm=(t,k)=>m.teams[t].players[k]||'?',T=m.teams.map(t=>t.players.map(()=>({r:0,o:0,w:0,g:0,ct:0,ro:0,st:0})));
 const ds=(n,d)=>{const f=nm(n.bowl,d.f),b=nm(n.bowl,d.bw);return{b:'b '+b,c:'c '+f+' b '+b,lb:'lbw b '+b,st:'st '+f+' b '+b,ro:'run out ('+f+')'}[d.h]||''};
 L.push('INDOOR CRICKET SCORECARD',m.teams[0].name+' v '+m.teams[1].name,m.date+' | '+m.fmt+' players | '+MAXO(m)+' overs','',m.done?'RESULT: '+result(m):'IN PROGRESS - innings '+(m.ci+1),'');
 m.inn.forEach((n,i)=>{const o=compute(m,i),bt=n.bat,bw=n.bowl;

  L.push(pd('BATTERS',18)+rp('Ct',4)+rp('RO',4)+rp('St',4)+rp('Bwd',4)+rp('R',5)+rp('B',5)+rp('Out',5)+rp('Net',6)+rp('SR',7));
  for(const k of Object.keys(o.bat).sort((a,b)=>a-b)){const b=o.bat[k];L.push(pd(nm(bt,k),18)+['c','ro','st','b'].map(h=>rp(b.d.filter(d=>d.h==h).length||'-',4)).join('')+rp(b.r,5)+rp(b.b,5)+rp(b.w,5)+rp(b.r-b.w*W,6)+rp((b.b?(b.r/b.b*100).toFixed(1):'-'),7));const x=T[bt][k];x.r+=b.r;x.o+=b.w}
  L.push('',pd('PAIRS / SPELLS',36)+rp('Ov',5)+rp('R',5)+rp('Out',5)+rp('Net',6));
  for(const k of Object.keys(o.pair).sort()){const p=o.pair[k];L.push(pd(((SPL(n)[k]||{}).pl||[]).map(x=>nm(bt,x)).join(' & '),36)+rp(ovs(p.b),5)+rp(p.r,5)+rp(p.w,5)+rp(p.r-p.w*W,6))}
  L.push('',pd('BOWLING ('+m.teams[bw].name+')',24)+rp('Ov',5)+rp('R',5)+rp('W',4)+rp('Wd',4)+rp('Nb',4)+rp('Eco',6));

 const RW=m.teams.map((t,ti)=>{const rows=t.players.map((p,k)=>({p,...T[ti][k],c:T[ti][k].r+(T[ti][k].w+T[ti][k].ro)*W-T[ti][k].g-T[ti][k].o*W}));rows.sort((a,b)=>b.c-a.c);return rows});L.push('=== BEST PLAYERS ===');RW.forEach((rows,ti)=>{const b=rows.filter(x=>x.c==rows[0].c);L.push(b.slice(0,3).map(x=>x.p).join(' & ')+(b.length>3?' +'+(b.length-3)+' more':'')+' ('+m.teams[ti].name+') - contribution '+rows[0].c)});L.push('');RW.forEach((rows,ti)=>{const t=m.teams[ti];

function mkpdf(lines){

 const enc=s=>s.replace(/[^\x20-\x7e]/g,c=>({'−':'-','•':'.','·':'-','—':'-','–':'-'}[c]||'?')).replace(/[\\()]/g,'\\$&'),o=[],F=3+pg.length*2;
 o[1]='<</Type/Catalog/Pages 2 0 R>>';o[2]='<</Type/Pages/Kids['+pg.map((_,i)=>(3+i*2)+' 0 R').join(' ')+']/Count '+pg.length+'>>';

async function pdf(id){const m=id?S.ms.find(x=>x.id==id):M();if(!m)return dlg('Start or open a match first');

function card(m,i){

function summ(m){
 const T=m.teams.map(t=>t.players.map(()=>({r:0,o:0,w:0,g:0,ct:0,ro:0,st:0}))),W=m.cfg.wkt;
 m.inn.forEach((n,i)=>{const o=compute(m,i);
  for(const k in o.bat){const x=T[n.bat][k],b=o.bat[k];x.r+=b.r;x.o+=b.w}
  for(const k in o.bowl){const x=T[n.bowl][k],b=o.bowl[k];x.w+=b.w;x.g+=b.r}
  for(const k in o.fld){const x=T[n.bowl][k],f=o.fld[k];x.ct+=f.ct;x.ro+=f.ro;x.st+=f.st}});
 const R=m.teams.map((t,ti)=>{const rows=t.players.map((p,k)=>{const x=T[ti][k];return{p,...x,c:x.r+(x.w+x.ro)*W-x.g-x.o*W}}),tot=rows.reduce((a,x)=>a+x.c,0);rows.sort((a,b)=>b.c-a.c);return{t,rows,tot}});
 const best=`<div class="sb"><small>BEST PLAYERS</small>${R.map(({t,rows})=>{const b=rows.filter(x=>x.c==rows[0].c);return`<div style="margin-top:8px"><b>🏅 ${esc(b.slice(0,3).map(x=>x.p).join(' & ')+(b.length>3?' +'+(b.length-3)+' more':''))}</b> <span style="opacity:.75">(${esc(t.name)})</span> — <b style="font-size:20px">${rows[0].c}</b> contribution</div>`}).join('')}</div>`;
 return best+R.map(({t,rows,tot})=>{
  return`<div class="card"><h3>${esc(t.name)} — player contribution (${tot})</h3><table><tr><th>Player</th><th>Runs</th><th>Wkts</th><th>Given</th><th>Out</th><th>RO</th><th>Contrib</th></tr>${rows.map(x=>`<tr><td>${esc(x.p)}</td><td>${x.r}</td><td>${x.w}</td><td>${x.g}</td><td>${x.o}</td><td>${x.ro}</td><td><b>${x.c}</b></td></tr>`).join('')}</table><p class="mu">Contribution = runs scored + ${W}×(bowling wickets + run outs) − runs given − ${W}×times out.</p></div>`}).join('')}

 <div class="grid2">${[0,1].map(i=>`<div class="card"><h3>Team ${'AB'[i]}</h3><input id="n${i}" placeholder="Team ${'AB'[i]} name"><p class="mu" style="margin:8px 0 4px">Players, one per line (batting order, pairs: 1-2, 3-4…). Optional.</p><textarea id="p${i}" rows="${S.fmt+1}"></textarea></div>`).join('')}</div>

 m.inn.forEach(x=>x.ovb=x.ovb||{});const i=m.ci,n=m.inn[i],o=compute(m,i),bt=m.teams[n.bat],bw=m.teams[n.bowl],mx=MAXO(m)*6;

 <div class="card"><div class="row sp"><h3 style="margin:0">Bowler</h3><span><b>${n.ovb[o.ov]!=null?esc(bw.players[n.ovb[o.ov]]):'—'}</b> ${!o.cur.length&&n.ovb[o.ov]!=null?'<button class="btn" onclick="chBw()">Change</button>':''}</span></div><div style="margin-top:10px">${o.cur.map(l=>`<span class="ball ${l=='W'?'W':l.length>1&&l[0]!='•'?'x':''}">${l}</span>`).join('')||'<span class="mu">New over — pick bowler, then score</span>'}</div></div>

 ${S.mode?`<div class="row" style="margin-bottom:8px"><button class="btn ${S.cnt?'on':''}" style="flex:1" onclick="S.cnt=1;render()">Counted: +${m.cfg.wd}, ball counts</button><button class="btn ${S.cnt?'':'on'}" style="flex:1" onclick="S.cnt=0;render()">Not counted: +1, re-bowl</button></div>`:''}<div class="mu" style="margin-bottom:6px">${S.mode?'Extra selected — tap additional runs (0 for none)':'Tap runs off the bat'}</div><div class="row">${[0,1,2,3,4,5,6].map(r=>`<button class="btn run" onclick="press(${r})">${r}</button>`).join('')}<button class="btn run w" onclick="S.wk={how:'b',os:0,fl:0};render()">Wkt −${m.cfg.wkt}</button></div></div>
